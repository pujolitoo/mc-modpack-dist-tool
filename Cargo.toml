[package]
name = "modpack-launcher"
version = "1.0.0"
edition = "2021"
description = "Launcher de un clic para modpacks exportados desde Modpack Forge"

[dependencies]
# Minecraft installation and launch engine (the same library used by the PortableMC CLI).
portablemc = "5.0.3"

# Cross-platform graphical interface (Windows / macOS / Linux), a single binary with no web dependencies.
eframe = "0.31"
egui_extras = "0.31"
rfd = "0.15"            # native system dialogs (choose folder)
webbrowser = "1"        # abrir el navegador para el login de Microsoft

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"           # HTTP bloqueante ligero (descarga de mods y del modpack)
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
dirs = "6"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }   # RAM total del equipo

[build-dependencies]
toml = "0.8"   # build.rs lee launcher.toml al compilar

[profile.release]
opt-level = 3
lto = "thin"
strip = true
