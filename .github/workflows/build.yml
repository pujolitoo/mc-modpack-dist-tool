
name: Build and release launcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: ""
            args: ""
            path: target/release/modpack-launcher.exe
            asset: modpack-launcher-windows-x64.exe

          - name: linux-x64
            os: ubuntu-latest
            target: ""
            args: ""
            path: target/release/modpack-launcher
            asset: modpack-launcher-linux-x64

          - name: macos-arm64
            os: macos-latest
            target: ""
            args: ""
            path: target/release/modpack-launcher
            asset: modpack-launcher-macos-arm64

          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            path: target/x86_64-apple-darwin/release/modpack-launcher
            asset: modpack-launcher-macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libssl-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Configure update URL
        env:
          UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/${{ matrix.asset }}
        run: |
          python -c "import os,re,pathlib; p=pathlib.Path('launcher.toml'); s=p.read_text(encoding='utf-8'); s,n=re.subn(r'(?m)^update_url\s*=.*$', 'update_url = \"'+os.environ['UPDATE_URL']+'\"', s, count=1); assert n == 1, 'update_url not found'; p.write_text(s, encoding='utf-8')"

      - name: Build launcher
        run: cargo build --release ${{ matrix.args }}

      - name: Prepare release asset
        env:
          SOURCE_PATH: ${{ matrix.path }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          python -c "import os,pathlib,shutil; src=pathlib.Path(os.environ['SOURCE_PATH']); dst=pathlib.Path('dist')/os.environ['ASSET_NAME']; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst); print(dst)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
