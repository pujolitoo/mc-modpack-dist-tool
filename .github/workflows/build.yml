
name: Build Villazucar modpack launcher

on:
  push:
    branches:
      - villa

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: ""
            args: ""
            path: target/release/modpack-launcher.exe
            asset: modpack-launcher-windows-x64.exe

          - name: linux-x64
            os: ubuntu-latest
            target: ""
            args: ""
            path: target/release/modpack-launcher
            asset: modpack-launcher-linux-x64

          - name: macos-arm64
            os: macos-latest
            target: ""
            args: ""
            path: target/release/modpack-launcher
            asset: modpack-launcher-macos-arm64

          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            path: target/x86_64-apple-darwin/release/modpack-launcher
            asset: modpack-launcher-macos-x64

    steps:
      - name: Checkout villa branch
        uses: actions/checkout@v4
        with:
          ref: villa

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libssl-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2


      - name: Configure update URL
        env:
          UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/${{ matrix.asset }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("launcher.toml")
          content = path.read_text(encoding="utf-8")

          updated, count = re.subn(
              r'(?m)^(\s*update_url\s*=\s*).*$',
              lambda match: match.group(1) + '"' + os.environ["UPDATE_URL"] + '"',
              content,
              count=1,
          )

          if count != 1:
              raise RuntimeError("Could not find update_url in launcher.toml")

          path.write_text(updated, encoding="utf-8")
          print("Updated launcher.toml with the release URL.")
          PY


      
      - name: Configure API key
        env:
          API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import json
          from pathlib import Path

          path = Path("launcher.toml")
          content = path.read_text(encoding="utf-8")

          api_key = os.environ.get("API_KEY", "")
          if not api_key:
              raise RuntimeError("CURSEFORGE_API_KEY secret is missing")

          section = re.search(
              r"(?ms)^\[curseforge\]\s*\n.*?(?=^\[|\Z)",
              content
          )

          if not section:
              raise RuntimeError("Missing [curseforge] section")

          block = section.group(0)
          key_line = re.compile(r"(?m)^(\s*api_key\s*=\s*).*$")

          if key_line.search(block):
              block = key_line.sub(
                  lambda m: m.group(1) + json.dumps(api_key),
                  block,
                  count=1
              )
          else:
              block = block.rstrip() + "\napi_key = " + json.dumps(api_key) + "\n"

          content = content[:section.start()] + block + content[section.end():]
          path.write_text(content, encoding="utf-8")

          print("CurseForge API key configured.")
          PY

       
      - name: Build launcher
        run: cargo build --release ${{ matrix.args }}

      - name: Prepare release asset
        env:
          SOURCE_PATH: ${{ matrix.path }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          python -c "import os,pathlib,shutil; src=pathlib.Path(os.environ['SOURCE_PATH']); dst=pathlib.Path('dist')/os.environ['ASSET_NAME']; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst); print(dst)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
